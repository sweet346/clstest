proxy-providers:
  魔戒:
    type: http
    url: ""  # 填入订阅链接
    interval: 3600  # 订阅更新间隔，单位：秒
    proxy: DIRECT  # 下载订阅时使用的策略
    # 在 Provider 层统一排除公告、流量、到期等非节点条目，避免各策略组重复配置
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    header:  # 可选：自定义 HTTP 请求头
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204
    override:
      udp: true
      # 不建议默认跳过 TLS 证书校验；仅在明确需要兼容特定节点时启用
      skip-cert-verify: true
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"
  牛逼:
    type: http
    url: ""  # 填入订阅链接
    interval: 3600  # 订阅更新间隔，单位：秒
    proxy: DIRECT  # 下载订阅时使用的策略
    # 在 Provider 层统一排除公告、流量、到期等非节点条目，避免各策略组重复配置
    filter: "^(?!.*(DIRECT|如果只|太旧|重新复制|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    header:  # 可选：自定义 HTTP 请求头
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204
    override:
      udp: true
      # 不建议默认跳过 TLS 证书校验；仅在明确需要兼容特定节点时启用
      skip-cert-verify: true
      # additional-prefix: "[provider1]"
      # additional-suffix: "test"
  守候:
    type: http
    url: ""  # 填入订阅链接
    interval: 3600  # 订阅更新间隔，单位：秒
    proxy: DIRECT  # 下载订阅时使用的策略
    # 在 Provider 层统一排除公告、流量、到期等非节点条目，避免各策略组重复配置
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    header:  # 可选：自定义 HTTP 请求头
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204
    override:
      udp: true
      # 不建议默认跳过 TLS 证书校验；仅在明确需要兼容特定节点时启用
      skip-cert-verify: true
      # additional-prefix: "[provider2]"
      # additional-suffix: "test"

# ==================== 代理策略组 Proxy Groups ====================
